name: Deliver Ritm reminders
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reminder-delivery.yml'
      - 'scripts/dispatch-reminders.mjs'
      - 'reminder-store.mjs'
      - 'personal-domain.mjs'
      - 'server.js'
permissions:
  contents: read
  id-token: write
concurrency:
  group: ritm-reminder-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Deliver due device notifications
        env:
          RITM_ORIGIN: https://ritm-r9m8.onrender.com
        run: node scripts/dispatch-reminders.mjs
