name: Deliver Ritm reminders
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reminder-delivery.yml'
      - 'scripts/dispatch-reminders.mjs'
      - 'reminder-store.mjs'
      - 'personal-domain.mjs'
      - 'server.js'
permissions:
  contents: read
  id-token: write
concurrency:
  group: ritm-reminder-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Deliver due device notifications
        env:
          RITM_ORIGIN: https://ritm-r9m8.onrender.com
        run: node scripts/dispatch-reminders.mjs
