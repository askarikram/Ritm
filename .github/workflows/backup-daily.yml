name: Back up all Ritm data
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/backup-daily.yml', 'backup.mjs', 'scripts/backup-daily.mjs']
permissions:
  contents: read
  id-token: write
concurrency:
  group: ritm-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Obtain an encrypted complete snapshot
        run: node scripts/backup-daily.mjs
      - name: Keep the encrypted backup for 30 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ritm-full-backup-${{ github.run_id }}
          path: backup-output/*.json
          if-no-files-found: error
          retention-days: 30
